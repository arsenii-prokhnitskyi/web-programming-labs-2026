<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЛР5 · DOM і події</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><link rel="icon" href="data:,"></head><body><main><h1>ЛР5. DOM і події</h1><p>Усі п'ять завдань. Варіант 12: спортивне взуття.</p>
<section><h2>1. Температура</h2><label>За Фаренгейтом <input id="fahrenheit" type="text" inputmode="decimal" value="32"></label><label>За Цельсієм <input id="celsius" type="text" inputmode="decimal" value="0"></label><p id="temperature-status" role="status"></p></section>
<section id="quiz-text"><h2>2. Таблиця множення: введення</h2><p class="score"></p><button class="next">Наступне завдання</button><p class="question"></p><label>Відповідь <input class="answer" inputmode="numeric" type="text"></label><button class="check">Перевірити</button><p class="feedback" role="status"></p></section>
<section id="quiz-radio"><h2>3. Таблиця множення: вибір</h2><p class="score"></p><button class="next">Наступне завдання</button><p class="question"></p><div class="options"></div><p class="feedback" role="status"></p></section>
<section><h2>4. Галерея спортивного взуття</h2><div id="rotator"></div><p>Фото: Unsplash; джерела у файлі images/SOURCES.md.</p></section>
<section><h2>5. Піксельна captcha</h2><div id="captcha-image" aria-label="Піксельне число для перевірки"></div><form id="captcha-form"><label>Введіть число <input id="captcha-input" inputmode="numeric" autocomplete="off" required></label><button>Перевірити число</button></form><p id="captcha-result" role="status"></p></section>
</main></body></html>
