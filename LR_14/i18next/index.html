<!doctype html><html lang="uk"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Каталог автомобілів</title><link rel="stylesheet" href="style.css"><script src="vendor/i18next.min.js"></script><script type="module" src="app.js"></script></head><body data-page="catalog"><div class="language-bar"><label><span data-i18n="language">Мова</span> <select id="language"><option value="uk">Українська</option><option value="en">English</option></select></label></div><main hidden>
<header class="shop-header"><h1 id="catalog-title">Каталог автомобілів</h1><a id="cart-link" href="basket.html" aria-label="Корзина"><span aria-hidden="true">🛒</span> <span data-i18n="cart">Корзина</span> <strong id="cart-count">0</strong></a></header>
<p id="shop-status" role="status"></p><div id="products" class="products"></div>

<dialog id="empty-dialog"><p data-i18n="empty">Корзина пуста</p><button data-close="empty-dialog" data-i18n="close">Закрити</button></dialog>
